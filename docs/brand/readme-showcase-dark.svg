<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="256" viewBox="0 0 1280 256" role="img" aria-label="Every state drawn: Badges with a shape for every state.; Windows in place: A tiling desktop built on AeroSpace.; Motion with intent: Transitions keep the desktop coherent.">
